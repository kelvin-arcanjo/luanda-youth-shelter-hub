<!DOCTYPE html>
<html lang="PT-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamba Care _ Luanda Youth Shelter Hub</title>
    <link rel="stylesheet" href="style.css">


    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="map"></div>

    <div class="legend-container">
        <h4>Legenda:</h4>
        <div class="legend-item">
            <span class="legend-badge badge-shelter"></span>
            <span>Abrigo</span>
        </div>
        <div class="legend-item">
            <span class="legend-badge badge-food_aid"></span>
            <span>Apoio Alimentar</span>
        </div>
    </div>


    <form action="" id="facilityForm">
        <h3>Adicionar Nova Instalação</h3>

        <label for="name">Nome:</label>
        <input type="text" id="name" required>

        <label for="category">Categoria:</label>
        <select id="category" required>
            <option value="shelter">Abrigo</option>
            <option value="food_aid">Apoio Alimentar</option>
        </select>

        <label for="municipality">Município:</label>
        <input type="text" id="municipality" required>

        <label for="lat">Latitude:</label>
        <input type="number" step="any" id="lat" required>

        <label for="lng">Longitude:</label>
        <input type="number" step="any" id="lng" required>

        <button type="submit">Guardar Instalação</button>
    </form>

    <div class="controls">
        <label for="categoryFilter">Filtrar por Categoria:</label>
        <select id="categoryFilter">
            <option value="all">Todas as Categorias</option>
            <option value="shelter">Abrigos</option>
            <option value="food_aid">Apoio Alimentar</option>
        </select>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
